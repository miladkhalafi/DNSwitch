name: DNSwitch
options:
  bundleIdPrefix: com.milad
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc signing: no Apple Developer account needed.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO

targets:
  DNSwitch:
    type: application
    platform: macOS
    sources:
      - DNSwitch
    info:
      path: DNSwitch/Info.plist
      properties:
        CFBundleDisplayName: DNSwitch
        # Filled from build settings so CI can stamp the release version.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        # macOS only reveals Wi-Fi network names to apps with Location access.
        NSLocationUsageDescription: DNSwitch needs Location access to read the name of the Wi-Fi network you're connected to.
        NSLocationWhenInUseUsageDescription: DNSwitch needs Location access to read the name of the Wi-Fi network you're connected to.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.milad.DNSwitch
        PRODUCT_NAME: DNSwitch
        # Generated by Scripts/make-icon.swift
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
